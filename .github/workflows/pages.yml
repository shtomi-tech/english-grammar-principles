name: Deploy grammar knowledge graph

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Prepare public artifact
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p public
          cp -R viewer public/viewer
          cp -R graph public/graph
          cp -R principles public/principles
          cp README.md public/README.md
          cp index.html public/index.html
          touch public/.nojekyll
          test -f public/index.html
          test -f public/viewer/index.html
          test -f public/graph/graph.json
          test -f public/principles/nonfinite/nonfinite-verbs.md
          python -m json.tool public/graph/graph.json >/dev/null
          node --check public/viewer/app.js

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: public

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
